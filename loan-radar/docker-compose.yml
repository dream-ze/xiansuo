name: loan-radar

services:
  postgres:
    image: postgres:16
    container_name: loan-radar-postgres
    environment:
      POSTGRES_USER: loan_radar
      POSTGRES_PASSWORD: loan_radar_password
      POSTGRES_DB: loan_radar
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  media-crawler:
    image: nanmicoder/media-crawler:latest
    container_name: loan-radar-media-crawler
    ports:
      - "8080:8080"
    environment:
      MEDIA_CRAWLER_API_PORT: "8080"
    restart: unless-stopped
    profiles:
      - media-crawler

volumes:
  postgres_data:
